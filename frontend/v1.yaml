      description: >-
        A role with the permission codes it composes. bool RoleResponse.IsSystem
        marks a preset shipped

        with the platform — editable, but its `code` is fixed and it cannot be
        deleted.

        bool RoleResponse.Customized is true once an operator has edited a
        preset. Lifecycle is

        `DRAFT -&gt; ACTIVE -&gt; INACTIVE`; a role that is not `ACTIVE` grants
        nothing to

        any group on it.
    RoleUsedByResponse:
      required:
        - id
        - code
        - name
        - status
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
      description: An access group that references a role.
    RoleWriteRequest:
      required:
        - code
        - name
        - permissions
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        description:
          type:
            - "null"
            - string
        status:
          type:
            - "null"
            - string
      description: >-
        Creates or replaces a role — a named set of permission codes. On `PUT`
        the

        `permissions` list fully replaces the role's current set. `code` is
        ignored on

        `PUT` (a role's code never changes). `status` is `DRAFT`, `ACTIVE` or

        `INACTIVE`; only an `ACTIVE` role grants anything to a group that uses
        it. A custom

        role is created `DRAFT` when `status` is omitted. A role that has left
        `DRAFT`

        cannot be set back to it.
    ScopeResponse:
      required:
        - id
        - scopeType
        - organizationUnitId
        - geographicAreaId
        - resourceType
        - resourceId
        - description
      type: object
      properties:

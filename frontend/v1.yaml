      description: >-
        Every connector target within the caller's organization and geography
        scope, with its vendor, endpoint, current state and expected camera
        count. Targets outside scope are absent rather than refused. Credential
        *references* appear here; credential values never do.


        **Pagination is opt-in.** Send `page` (1-based) and optionally
        `pageSize` (default 50) to get a `{ items, page, pageSize, total,
        totalPages }` envelope. Omit `page` and the response is the plain array
        as before, capped at a safety maximum — when the cap trims the result
        the response carries `X-Result-Capped: true`. Either way `X-Total-Count`
        gives the full match count.


        **Requires permission:** `vms.read`
      parameters:

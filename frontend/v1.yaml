              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederatedCameraResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/vms/{id}/cameras/{nativeCameraId}/status-history:
    get:
      tags:
        - VMS
      summary: Read one camera's status timeline
      description: >-
        How this camera's health, enabled and recording flags have changed over
        time — newest first.


        **Transitions, not samples.** A row exists only where something actually
        changed, so a camera healthy for a month returns one row rather than a
        month of identical readings. Recording every poll would be 230M rows/day
        at 80,000 cameras. The status at any instant is the newest row at or
        before it, and each row carries the previous value as well as the new
        one so a timeline can be drawn without a second lookup.


        The last element may pre-date `from`: it is the transition that
        established the status the window opened with. Null previous values mean
        this is the camera's first observation, not that the earlier value is
        unknown.


        Defaults to the last 30 days; `from`, `to` and `limit` narrow it. This
        does not answer *whether the camera was being polled* at a given moment
        — that is `/vms/{id}/health` for the target, and `lastSeen` on the
        camera.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nativeCameraId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStatusHistoryResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

      description: >-
        Manual onboarding: creates one authoritative registry record.
        `cameraCode` must be unique among live cameras; `organizationUnitId` and
        `geographicAreaId` must both be within the caller's scope, or the
        request is refused. Coordinates are required and validated. Optics
        (`azimuth`, `horizontalFov`, `effectiveRange`) are optional but all

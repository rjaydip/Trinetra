      description: >-
        The administrative reset, for an account whose holder cannot log in. A
        user changing their own password uses `POST /auth/password` instead,
        which requires the current one.


        The new password always lands flagged must-change: an administrator
        performing a reset necessarily knows the value, so it must not remain
        the user's working credential. The reset also **ends every session the
        account has** — access tokens fail on next use, refresh tokens are
        revoked.


        Resetting an account with more authority than the caller is refused —

    post:
      tags:
        - VMS
      summary: Start, stop or quarantine polling for a target
      description: >-
        **Step 4 of onboarding: this is what puts a target into service.** The
        workers act on state, so nothing is polled until it is `Active`, and
        setting it back stops the polling without losing the configuration or
        the discovered inventory.


        Quarantine is the state for a device that is answering badly enough to
        be worth taking out of the fleet without deleting it. Send the value as
        a string; the 400 response lists the states this build accepts.


        **Requires permission:** `vms.update`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:

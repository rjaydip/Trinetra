      description: >-
        Changes display name, email or status. Membership is not touched here —
        use `/users/{id}/groups`.


        Deactivating an account (setting `status` to anything other than
        `ACTIVE`) takes effect **immediately**: its access tokens fail on their
        next request and all its refresh tokens are revoked, in the same

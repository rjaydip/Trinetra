            - string
          format: uuid
        geographicAreaId:
          type:
            - "null"
            - string
          format: uuid
        resourceType:
          type:
            - "null"
            - string
        resourceId:
          type:
            - "null"
            - string
          format: uuid
        description:
          type:
            - "null"
            - string
      description: One boundary a group's permissions apply within.
    TargetStateRequest:

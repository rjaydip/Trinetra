      summary: Register a VMS, NVR or camera gateway
      description: >-
        **Step 1 of onboarding, and the only way cameras enter the system.**
        Creates the connector target a worker will poll; its cameras are then
        discovered, not registered individually.


        `vendor` selects the adapter — CP Plus and other Dahua OEM units use
        `DahuaCgi`. `credentialReference` names where the secret will live; the
        secret itself is written separately through `PUT /vms/{id}/credential`.
        Polling intervals, rate limit and concurrency all have defaults tuned
        for a mid-size NVR and only need setting for a device that cannot keep
        up.


        The target is created in its default state and is not polled until `POST
        /vms/{id}/state` activates it. An unparseable endpoint or unknown vendor
        is rejected here rather than becoming an unexplained dead site later. So
        is a deactivated `organizationUnitId` or `geographicAreaId` — an
        active-looking target attached to a retired unit would otherwise never
        appear in anyone's scope.


        **Requires permission:** `vms.create`
      requestBody:

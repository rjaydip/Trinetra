  /api/v1/vms/{id}:
    get:
      tags:
        - VMS
      summary: Read one VMS target's configuration
      description: >-
        The full configuration row: vendor, runtime class, endpoint, TLS
        verification, state and credential reference.


        A target the caller is not scoped to returns **404, not 403** — telling
        an unauthorized caller that an id exists is itself a disclosure.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmsResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    put:
      tags:
        - VMS
      summary: Replace a VMS target's configuration
      description: >-
        A full replacement, not a patch: every field is taken from the body, and
        one left out reverts to its default. Read the target first and send it
        back modified.


        Does not change the target's state, and does not write a credential —
        those are `POST /vms/{id}/state` and `PUT /vms/{id}/credential`.
        Changing `endpoint` or `vendor` takes effect at the worker's next poll
        cycle.


        `organizationUnitId` and `geographicAreaId` must reference an **active**
        unit and area — a deactivated one is a 400, not a silent drop out of
        scope resolution.


        Omitting `verifyTls` sets it to `true`, the safe default — **not** the
        target's previous value, because this endpoint replaces rather than
        patches. Sending `verifyTls: false` explicitly disables certificate
        verification and is recorded as such in the audit log.


        The before and after values are recorded in the audit log, with the
        credential reference kept and its value never present to begin with.


        **Requires permission:** `vms.update`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorTargetRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    delete:
      tags:
        - VMS
      summary: Remove a VMS target
      description: >-
        A hard delete that cascades: the discovered camera inventory, capability
        matrix, health history, event cursor and connection-test records for
        this target all go with it. Events already published to the bus and
        stored are keyed by source and remain. `camera_status_history` rows for
        this target's cameras are **not** cascaded either — they carry no
        foreign key to the target by design (an append-only timeline, not owned
        state) and stay queryable by `targetId` after deletion, ageing out under
        the normal retention window.


        **The target must not be `Active`.** Set its state to something else
        with `POST /vms/{id}/state` first — a 409 otherwise. This stops a delete
        from racing a worker that currently holds the target's lease.


        To stop polling a device without losing any of that, set its state
        instead. The deleted configuration is captured in the audit row.


        Gated on `vms.delete`, not `vms.update`: permanently destroying a target
        and its whole inventory is a distinct, irreversible action from editing
        it.


        **Requires permission:** `vms.delete`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

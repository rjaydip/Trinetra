    get:
      tags:
        - VMS
      summary: Read what this target's adapter can actually do
      description: >-
        The capability matrix probed when a worker last connected, plus the
        adapter version that probed it. No VMS supports every capability, so a
        client should ask here rather than assume — an unsupported call is a
        wasted round trip against a device that is already rate limited.


        Served from the stored matrix and **never by probing the device**:
        letting a dashboard render trigger probes would turn one page load into
        thousands of vendor round trips.


        A `404` means either the target is out of your scope or no worker has
        reached it yet — the two are deliberately indistinguishable. Check the
        target's state and connection test if you expected a matrix.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

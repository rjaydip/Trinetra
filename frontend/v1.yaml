      summary: Check whether this target has a credential stored
      description: >-
        Presence only — the reference and a boolean. This exists so an operator
        can tell an unprovisioned target from a misconfigured one without
        revealing a secret.


        `exists: false` on a target that fails its connection test is the
        ordinary cause: it was registered but never given a credential.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK

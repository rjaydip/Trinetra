  /api/v1/vms/{id}/credential/resolve:
    get:
      tags:
        - Credentials
      summary: Resolve the credential a worker connects to this target's streams with
      description: >-
        **The one route on this API that returns a secret.** Hands back the
        username, password and/or token stored for this target so a caller can
        connect to it directly.


        Exists for the standalone AI worker (`ai-worker/`, Model 2), which reads
        camera RTSP streams itself and needs their login. `credential.resolve`
        is carried by exactly one role — `DETECTION_WORKER`, a machine role with
        no interactive login — and the worker authenticates with `X-Api-Key`,
        not a bearer token.


        Scoped through the target in the path, exactly as `/status` and `PUT /`
        are: a caller resolves a credential only for a target their organization
        and geography grants already reach. The `DETECTION_WORKER` access group
        must therefore be given a scope that covers the targets, or this returns
        404.


        Every call is written to `credential_access_log` with the caller and the
        target. If that audit row cannot be written the secret is withheld and
        the response is 503 — there is no path that discloses a credential
        without a log row.


        404 if the target is out of scope, or if it exists but no credential was
        ever provisioned (the same state `/status` reports as `exists: false`).
        Vendor extras (Milestone OAuth client, Genetec application id) are not
        returned here.


        **Requires permission:** `credential.resolve`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCredentialResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/vms/{id}/test:
    post:
      tags:
        - VMS
      summary: Start a connection test against the live device
      description: >-
        **Step 3 of onboarding: proves the target answers before it is handed to
        the workers.** Resolves the stored credential, connects with the vendor
        adapter, and reports what it found — reachability, authentication, and
        the capabilities the device advertises.


        **Asynchronous by design.** A test can take up to a minute, which is
        longer than most reverse proxies will hold a connection, so this returns
        `202` with a `testId` and a `statusUrl` to poll. A black-holed device
        then produces a clear result rather than a dropped request.


        One test at a time per target: a second request while one is in flight
        is a `409` carrying the running `testId` to poll instead.


        Needs `integration.manage`, not `vms.read` — this authenticates to a
        live device and consumes one of its limited session slots, which is an
        integration action rather than a read of platform data.


        **Requires permission:** `integration.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestAccepted"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    get:
      tags:
        - VMS
      summary: List this target's connection tests
      description: >-
        Test history for the target: who ran each one, when, and how it ended.
        Useful for telling a device that has always been unreachable from one
        that broke at a particular time, and for finding the in-flight test
        behind a 409.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:

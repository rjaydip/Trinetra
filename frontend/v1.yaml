  securitySchemes:
    Bearer:
      type: http
      description: >-
        **Paste the token by itself. Do not type `Bearer`.**


        Scalar adds the `Bearer ` prefix for you. Typing it as well sends
        `Authorization: Bearer Bearer <token>`, which fails validation, and
        every call comes back 401 with a token that is perfectly valid.


        Get the value from the `token` field of `POST /api/v1/auth/login`.
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      description: For service integrations. People use a bearer token instead.
      name: X-Api-Key
      in: header
    OAuth2:
      type: oauth2
      description: Enter your Trinetra username and password; Scalar fetches a token
        and applies it to every request. No client id or secret. For a real
        integration use an API key header instead.
      flows:
        password:
          tokenUrl: /api/v1/auth/token
          scopes: {}
tags:
  - name: Authentication
    description: Obtaining and rotating a caller's own credentials for this API.
      `POST /auth/login` returns the bearer token every other endpoint expects;
      it is the only route here that is anonymous, and it is rate limited per
      source address. Machine callers use an API key header instead and never
      touch this group. Managing *other* people's accounts is under Users, not
      here.
  - name: Organizations
    description: "The organizational dimension of scope: organizations and the unit
      tree beneath them. Every VMS target belongs to an organization unit, and a
      caller's grants over that tree decide which targets they can see at all.
      This dimension is independent of Geography and the two are ANDed — a
      caller scoped to a department still sees only the districts they were
      granted."
  - name: Geography
    description: "The geographic dimension of scope: an operator-defined area
      hierarchy (state, district, zone, ward, or whatever levels a deployment
      defines) with no fixed bottom tier — a camera or VMS target attaches to an
      area at any level. Read routes need `geography.read`; changing the
      hierarchy needs `geography.manage`, because a reparent moves everything
      below it into a different scope."
  - name: Users
    description: Accounts, their profile and status, their group membership, and the
      effective permission set that membership resolves to. Permissions are
      never granted to a user directly — they come from access groups, so `GET
      /users/{id}/permissions` is a computed view rather than something you can
      write to.
  - name: Access control
    description: "Access groups and the scope grants attached to them: the join
      between a role's permissions and the slice of the organization and
      geography those permissions apply over. `/roles` and `/permissions` are
      the reference data the UI builds its pickers from. This is the group that
      decides what everyone else can do, so every write here needs
      `group.manage` and is audited."
  - name: API keys
    description: Keys for machine-to-machine callers — another department's system,
      a reporting job, the standalone AI worker. A key acts through one access
      group, exactly as a user does. The raw value is shown once at creation and
      only its SHA-256 is stored; revocation takes effect on the key's next
      request, after which it fails as a uniform 401. Managing keys needs
      `apikey.manage`, listing them `apikey.read`.
  - name: VMS
    description: "Connector targets — one row per VMS, NVR or camera gateway the
      platform federates — plus everything the workers report back about them:
      health history, the probed capability matrix, the discovered camera
      inventory, and connection tests against the live device. Cameras are
      discovered, never registered one at a time: a target is polled as a whole,
      because per-camera polling does not survive 80,000 cameras."
  - name: Cameras
    description: "The authoritative camera registry: the CCTV assets themselves,
      registered deliberately — one at a time, by bulk import, or via API —
      rather than discovered from a VMS. Ownership (an organization unit) and
      location (a site) are independent dimensions and a caller's grants over
      both decide which cameras they see. This is the stable camera identity
      that observations and VMS reconciliation point at."
  - name: GIS
    description: The map source and coverage analysis over the registry. `GET
      /gis/cameras` returns a bounding-box-limited GeoJSON FeatureCollection to
      draw markers and coverage wedges from; per-camera coverage sectors are
      computed from azimuth, horizontal FOV and effective range. Coverage is an
      **estimate** — terrain and obstructions are not modelled. Gap analysis
      needs a spatial engine and is not available yet.
  - name: Credentials
    description: "Provisioning the credential a connector authenticates to a device
      with, and resolving it. Writing (`PUT /`) and `/status` never return
      secret material. `GET /resolve` is the **single** route on this API that
      does: it requires `credential.resolve` — held only by the
      `DETECTION_WORKER` machine role — exists for the AI worker that connects
      to camera streams directly, and audits every call. Every route here is
      scoped through the target in the path, so a caller only touches a
      credential for a target they can already reach."
  - name: Events
    description: Queries over the normalized event stream in its hot PostgreSQL
      window. `from` and `to` are required and may span at most seven days — the
      table is partitioned by time and takes 100-400M rows a day, so an
      unbounded query cannot be served. Paging is by opaque cursor, never
      offset. Wide historical and free-text search belongs to OpenSearch and is
      not served here.
  - name: Detections
    description: Model 2's vehicle/plate/OCR detections, submitted by the standalone
      AI worker (`ai-worker/`, Python) rather than produced inside this API.
      `POST /detections` is the ingest sink it POSTs to; a freshly-inserted
      detection is matched against the active watchlist in the same transaction.
      Machine-to-machine only — the worker authenticates with `X-Api-Key`, not a
      login token.
  - name: Watchlist
    description: Plate numbers an operator wants flagged, and the alerts raised when
      a detection matches one. Matching happens once, at ingest — a retried
      detection POST never raises a second alert for the same match.
  - name: Worker health
    description: "Liveness for AI-worker processes
      (`ai-worker/monitoring/heartbeat.py`). Separate from the connector-worker
      `worker_node` registry: an AI worker owns a static camera partition rather
      than a lease, so it has its own lifecycle here."

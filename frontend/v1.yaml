      summary: Submit a vehicle/plate/OCR detection
      description: >-
        The ingest sink for Model 2's standalone AI worker. Idempotent on `id` —
        a retried POST for an already-seen detection is accepted again but
        changes nothing and never raises a second watchlist alert.


        `cameraId` is `"{targetId}:{nativeCameraId}"`, exactly as the worker's
        own camera discovery builds it from `GET /vms/{id}/cameras`. An id that
        does not resolve against the camera inventory is rejected — a detection
        cannot be scoped to an organization without a known camera.


        `evidence.snapshotBase64`, if present, is decoded and written under the
        configured evidence root; otherwise `evidence.snapshotPath` (today's
        worker-local path) is stored verbatim as an opaque reference. The
        snapshot is capped at `Evidence:MaxSnapshotBytes` (default 4 MB) and the
        whole request at 8 MB — an oversized or malformed `snapshotBase64` is a
        400. Returns 202: ingest is fire-and-forget from the worker's

  /api/v1/vms/{id}/cameras:
    get:
      tags:
        - VMS
      summary: List the cameras discovered behind this target
      description: >-
        **The camera inventory, and it is read-only.** Cameras are not onboarded
        through this API — a worker calls the adapter's inventory poll for the
        target's whole estate and upserts what comes back, so rows appear here
        on their own once the target is active and has been reached. An empty
        list on a healthy target means the first inventory poll has not run yet.


        Each row carries the vendor's native id, the platform camera id it maps
        to, model and firmware, whether it is enabled and recording, its
        last-seen time, and its stream **references**. Model 3 never touches
        video: a reference is an address to hand to a player or to Model 2, not
        a stream.


        **Pagination is opt-in.** Send `page` (1-based) and optionally
        `pageSize` (default 50) to get a `{ items, page, pageSize, total,
        totalPages }` envelope. Omit `page` and the response is the plain array
        as before, capped at a safety maximum — when the cap trims the result
        the response carries `X-Result-Capped: true`. Either way `X-Total-Count`
        gives the full match count.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32

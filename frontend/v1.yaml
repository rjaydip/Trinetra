openapi: 3.1.1
info:
  title: Trinetra Federation API
  description: >
    The read and configuration surface of Model 3 (VMS Federation).


    Every route is authenticated, scoped by organization and geography, and
    audited. Each operation states the permission it requires; a caller without
    it gets 403, and a resource outside their scope reads as 404 rather than 403
    so that ids cannot be probed.


    **To try anything here:** call `POST /api/v1/auth/login`, copy the `token`
    value, click **Authorize**, and paste the token **without** typing `Bearer`
    — Scalar adds that prefix itself, and typing it too sends `Bearer Bearer
    <token>`, which returns 401 on every call.


    This API never carries video. Streams and snapshots appear as references
    only.


    ---


    ## This deployment


    | | |

    |---|---|

    | Database | `trinetra` on `aws-0-ap-southeast-1.pooler.supabase.com:5432` |

    | PostgreSQL | PostgreSQL 17.6 on x86_64-pc-linux-gnu, compiled by gcc |

    | CORS origins | `http://localhost:5173`, `trinetra-api.marcentis.com` |

    | Retention | events 90d · health 30d · camera-status 90d · connection-tests
    30d · dead-letter 90d · audit 84mo · auth-audit 24mo |
  version: 1.0.0
servers:
  - url: https://trinetra-api.marcentis.com/
paths:
  /api/v1/organization-units/{id}:
    get:
      tags:
        - Organizations
      summary: Read one organization unit
      description: >-
        Code, name, type, parent and status for a single unit. A unit the caller
        has no grant over returns 404.


        **Requires permission:** `organization.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    put:
      tags:
        - Organizations
      summary: Update an organization unit
      description: >-
        Edits `code`, `name`, `unitType` and `description`; `status` is left
        as-is when omitted (use `/activate` and `/deactivate`). `organizationId`
        in the body is ignored — moving a unit to another organization is the
        separate `/move` route.


        `parentUnitId` **may** change: the unit and its whole subtree move under
        the new parent in the same organization. Re-parenting under the unit
        itself or one of its descendants is refused (400), as is a new parent
        that is not ACTIVE (400) or in a different organization (400).
        Re-parenting to root (`parentUnitId: null`) needs unscoped
        `organization.manage` (403). Editing an `INACTIVE` unit is refused (409)
        — reactivate it first. 404 if the id is unknown or out of the caller's
        reach.


        **Requires permission:** `organization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUnitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/organization-units/{id}/activate:
    post:
      tags:
        - Organizations
      summary: Activate an organization unit
      description: >-
        Moves an `INACTIVE` unit back to `ACTIVE`. Refused (409) when the unit's
        parent is itself `INACTIVE` — that would leave an active node under a
        retired one. Activation does **not** cascade: each child is activated on
        its own. Activating an already-active unit is a no-op (204, no audit
        row).


        **Requires permission:** `organization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/organization-units/{id}/move:
    post:
      tags:
        - Organizations
      summary: Move an organization unit to another organization
      description: >-
        Re-parents a unit under a parent in a **different** organization and
        rewrites the whole subtree's organization to match, in one transaction.
        Requires `organization.manage` held unscoped (403 otherwise).


        When any access group has an organization scope pointing into the
        subtree, the move is refused (409) with the affected groups in the body
        until the caller re-sends with `confirmScopeImpact: true` — those scopes
        keep pointing at the moved units and will then grant inside the new
        organization. Cameras, VMS targets and historic events follow the move
        automatically (they resolve organization through the live tree); the
        response reports how many.


        **Requires permission:** `organization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveUnitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveUnitResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/organization-units/{id}/deactivate:
    post:
      tags:
        - Organizations
      summary: Deactivate an organization unit
      description: >-
        Marks a unit inactive. Units are never hard-deleted — audit rows and VMS
        targets reference them, and a deleted unit would orphan both.


        **A unit with active children is refused with 409**, listing what would
        be affected. Re-send with `childStrategy: "cascade"` to deactivate the
        whole branch, or `"reparent"` plus `newParentId` to move the children
        somewhere else first. Neither is ever applied by default: cascading
        silently takes a department's whole estate out of scope, and silently
        reparenting hides a structural change no one approved.


        An id that is unknown or out of the caller's reach is **404** (a scoped
        caller gets **403**); a unit that is already inactive is an idempotent
        **204** — neither writes an audit row.


        **Requires permission:** `organization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/permissions:
    get:
      tags:
        - Access control
      summary: List every permission the platform defines
      description: >-
        The catalogue behind the **Requires permission** line on each operation
        in this document: every code, its category and what it allows. Read it
        to work out which role a user needs, or to interpret `GET
        /users/{id}/permissions`.


        **Requires permission:** `role.read`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/overview:
    get:
      tags:
        - VMS
      summary: Fleet totals for the caller's scope
      description: >-
        One row of counters for a landing page: targets, how many are active,
        how many are quarantined, total cameras and how many are unreachable.
        Aggregated in the database over the caller's scope, so two operators
        with different grants legitimately see different totals.


        **Requires permission:** `vms.read`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/gis/cameras:
    get:
      tags:
        - GIS
      summary: Camera map source (GeoJSON)
      description: >-
        A GeoJSON `FeatureCollection`, one `Point` feature per in-scope live
        camera inside `bbox` (**required**, `minLon,minLat,maxLon,maxLat`, span
        at most 2° each way). Feature properties carry the camera id, code,
        owner, type, the three status axes and the sector inputs. Pass
        `includeSectors=true` to attach each camera's computed coverage
        `Polygon`. Narrow with `organizationUnitId`, `operationalStatus`,
        `maintenanceStatus`.


        **The body is always a `FeatureCollection`.** Without `page` it is
        capped at 5000 features — when the cap trims the result the response
        carries `X-Result-Capped: true`, and `X-Total-Count` always gives the
        full match count. Send `page` (1-based) and optionally `pageSize` to
        walk the whole set; `X-Page` / `X-Page-Size` echo the window.


        **Requires permission:** `gis.read`
      parameters:
        - name: bbox
          in: query
          schema:
            type: string
        - name: includeSectors
          in: query
          schema:
            type: boolean
        - name: includeRetired
          in: query
          schema:
            type: boolean
        - name: organizationUnitId
          in: query
          schema:
            type: string
            format: uuid
        - name: operationalStatus
          in: query
          schema:
            type: string
        - name: maintenanceStatus
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/cameras/{id}/coverage:
    get:
      tags:
        - GIS
      summary: One camera's estimated coverage sector
      description: >-
        A GeoJSON `Feature` whose `Polygon` is the estimated ground area the
        camera can see: apex at the camera, bisector along its azimuth, width
        `horizontalFov`, radius `effectiveRange`. `204` when any of those three
        is missing. The response carries `estimated: true` and the modelling
        disclaimer.


        **Requires permission:** `gis.coverage.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/gis/coverage:
    get:
      tags:
        - GIS
      summary: Coverage aggregate — counts, no geometry
      description: >-
        Camera counts over an area (`geographicAreaId`, includes descendants) or
        a `bbox`, one of which is required, bucketed by operational status,
        maintenance status, manufacturer, owning unit, and whether the sector
        inputs are present. Optionally narrowed by `organizationUnitId`. No
        merged coverage polygon — that needs a spatial engine.


        **Requires permission:** `gis.coverage.read`
      parameters:
        - name: geographicAreaId
          in: query
          schema:
            type: string
            format: uuid
        - name: bbox
          in: query
          schema:
            type: string
        - name: organizationUnitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSummaryResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/gis/gaps:
    get:
      tags:
        - GIS
      summary: Coverage-gap layer — not available yet
      description: >-
        Planned for the release that introduces PostGIS and administrative
        boundary polygons. Returns 501 until then; the route exists so the
        contract is stable.


        **Requires permission:** `gis.coverage.read`
      responses:
        "200":
          description: OK
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/events:
    get:
      tags:
        - Events
      summary: Query normalized events over the hot window
      description: >-
        Events from every federated VMS in one shape, whatever vendor produced
        them, newest first and restricted to the caller's scope. `eventType` is
        the normalized type; `vendorEventType` is what the device actually
        called it, kept for tracing a normalization back to its source.


        **`from` and `to` are required and may span at most 7 days.** They are
        never defaulted: the table is partitioned by time and takes 100-400M
        rows a day at the design point, so a missing range silently becoming
        'everything' is the one query that takes the database down — and with it
        every worker writing events. Narrow further with `cameraId`, `eventType`
        or `objectReference`.


        Paging is by the opaque `cursor` from the previous page, never by offset
        — a deep offset on a partitioned table scans every row it skips. A
        response without a cursor is the end of the results.


        `limit` defaults to 100 and is clamped to 1000.


        **Boundary:** this is the hot PostgreSQL window only. Free-text and wide
        historical search belong to OpenSearch and are not served here.


        **Requires permission:** `event.read`
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: cameraId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: objectReference
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/auth-audit:
    get:
      tags:
        - Access control
      summary: Read the authentication audit trail
      description: >-
        Append-only record of authentication events — login success and failure,
        account lockout, refresh-token rotation and replay-theft, logout, self
        and administrative password changes, on-login password rehash, and
        API-key authentication outcomes. Newest first.


        The login *response* is coarse — an unknown username and a wrong
        password for a real account both return the same 401 — but the row
        records which: a resolved `userId` means the name existed, a
        `presentedUsername` with no `userId` means it did not. API-key successes
        are sampled (roughly one row per key per five minutes); API-key failures
        are always recorded.


        `from`/`to` default to the last 7 days and may span at most 31. Page
        with the opaque `cursor`; a response without one is the end. SUPER_ADMIN
        only.


        **Requires permission:** `authaudit.read`
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: eventType
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAuditPage"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Exchange a username and password for an access + refresh token pair
      description: >-
        The only anonymous route on the API that takes credentials. Returns a
        short access token (~15 minutes, sent as `Authorization: Bearer`)
        carrying the caller's resolved permissions and scope, and an opaque
        refresh token — store it and present it to `POST /auth/refresh` before
        the access token expires to get a new pair without re-entering
        credentials. `mustChangePassword: true` means the client must route the
        user to `POST /auth/password` first.


        Unknown user, wrong password, inactive account and lockout all return
        the same 401: distinguishing them would confirm which usernames exist.
        Rate limited to 10 attempts per minute per source address.


        Machine callers authenticate with an API key header instead and never
        call this route.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "500":
          description: Unexpected server error returned as ProblemDetails.
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Exchange a refresh token for a new token pair
      description: >-
        Rotates the session: returns a new ~15-minute access token and a **new**
        refresh token, and invalidates the one presented. The 8-hour refresh
        window slides forward on each call; 8 hours of inactivity ends the
        session and the user must log in again.


        Permissions and scope are **re-resolved from the database** on every
        call, so a group added or removed since login takes effect here (a
        removed group still lingers in the old access token for up to its
        ~15-minute life).


        An unknown, expired, revoked, or already-rotated token returns the same
        401 as a bad password. Presenting an already-rotated token outside a
        short grace window is treated as theft: every refresh token for that
        user is revoked, every access token is invalidated, and re-login is
        required. API-key callers get 400.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "500":
          description: Unexpected server error returned as ProblemDetails.
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: End your session on every device
      description: >-
        Revokes all of the calling user's refresh tokens and invalidates every
        access token already issued to them — not just the one on this request.
        There is no per-device logout; the token-pair model keeps no per-session
        identity to target. Idempotent. API-key callers get 400 — a key has no
        session, and is revoked through `DELETE /api/v1/api-keys/{id}` instead.


        **Permission:** any authenticated caller — a user must always be able to
        end their own session.
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/auth/password:
    post:
      tags:
        - Authentication
      summary: Change your own password
      description: >-
        Rotates the calling user's own password — never anyone else's; an
        administrator resetting another account uses `POST
        /users/{id}/password`. Requires the current password and rejects a new
        value equal to the old one.


        Re-checks that the account is active and not locked **before** verifying
        the current password — a deactivated account cannot use this route to
        clear its own lockout. On success it **ends every other session you
        have**: all your other access tokens and every refresh token are
        invalidated, and the response is a fresh access + refresh token pair
        (the same shape as `POST /auth/login`). API-key callers get 400 — there
        is no password to change.


        **Permission:** any authenticated caller — a user must always be able to
        rotate their own password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/organizations:
    get:
      tags:
        - Organizations
      summary: List organizations
      description: >-
        The top of the organizational dimension — one row per force, agency or
        operator whose units own VMS targets. Start here when building a scope
        picker, then walk down with `GET /organizations/{id}/units`.


        **Pagination is opt-in.** Send `page` (1-based) and optionally
        `pageSize` (default 50) to get a `{ items, page, pageSize, total,
        totalPages }` envelope. Omit `page` and the response is the plain array
        as before, capped at a safety maximum — when the cap trims the result
        the response carries `X-Result-Capped: true`. Either way `X-Total-Count`
        gives the full match count.


        **Requires permission:** `organization.read`
      parameters:
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    post:
      tags:
        - Organizations
      summary: Create an organization
      description: >-
        Creates the root of an organizational tree. `code` is the stable
        identifier operators and integrations refer to; `name` is display text
        and can change. Status defaults to `ACTIVE`.


        An organization on its own owns nothing — add units beneath it before a
        VMS target can be assigned anywhere.


        **Requires permission:** `organization.manage`
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

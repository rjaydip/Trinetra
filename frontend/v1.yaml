      summary: List access groups
      description: >-
        The groups you may see, each with its role, the permissions that role
        carries, its scopes and how many members it has. A group pairs one role
        with one or more scopes, which is what keeps a single `CAMERA_OPERATOR`
        role reusable instead of spawning AhmedabadPoliceCameraOperator,
        SuratPoliceCameraOperator and so on without end.


        A group is listed only if you could grant it — its scopes are within
        your reach (the same rule as adding a user to it). A group with no
        organization or no geography scope reaches every department or area, so
        it is visible only to an administrator already unscoped on that
        dimension. The platform-admin group is therefore invisible to every
        scoped administrator.


        **Pagination is opt-in.** Send `page` (1-based) and optionally
        `pageSize` (default 50) to get a `{ items, page, pageSize, total,

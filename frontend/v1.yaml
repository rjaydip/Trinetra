        assembled and reviewed before it grants anything; add its scopes, then
        activate it.


        A scoped caller cannot choose a role granting permissions they do not
        hold themselves — 403 naming the excess. The check is here as well as at
        assignment time, or a caller could build the group first and hand it to
        themselves through a route that only inspects it on the way out.



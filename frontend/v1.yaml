      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/vms/{id}/test/{testId}:
    get:
      tags:
        - VMS
      summary: Poll one connection test for its result
      description: >-
        The status URL returned by `POST /vms/{id}/test`. `status` is pending
        until the job finishes, then carries the outcome, the completion time, a
        failure reason if it failed, and the adapter's findings.


        Scope is re-checked on every read, so a result stops being readable by
        someone who has since lost access to the target. A test abandoned by a
        host that died is closed out by the sweeper rather than left pending
        forever.


        **Requires permission:** `vms.read`
      parameters:

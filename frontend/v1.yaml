    get:
      tags:
        - Users
      summary: List a user's group memberships
      description: >-
        The access groups this account belongs to, each with an optional
        `expiresAt`. An expired membership stops granting anything without
        anyone having to revoke it — the intended way to give temporary access.


        This is the only route to what a user is entitled to: permissions are
        never granted to an account directly. Requires authority over the
        account — otherwise `404`, so a scoped administrator cannot enumerate a
        higher administrator's entitlements.


        **Requires permission:** `user.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array

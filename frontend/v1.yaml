        only its SHA-256 is stored.


        A key is listed only if you could have provisioned it: its access group
        is within your reach for `apikey.read` (the same rule that governs
        granting the group). A scoped administrator therefore never sees a key
        bound to the platform-admin group or to another department's group. An
        unscoped administrator sees every key.


        **Pagination is opt-in.** Send `page` (1-based) and optionally
        `pageSize` (default 50) to get a `{ items, page, pageSize, total,
        totalPages }` envelope. Omit `page` and the response is the plain array
        as before, capped at a safety maximum — when the cap trims the result
        the response carries `X-Result-Capped: true`. Either way `X-Total-Count`
        gives the full match count.


        **Requires permission:** `apikey.read`
      parameters:
        - name: page
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: pageSize
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    post:
      tags:
        - API keys
      summary: Provision an API key
      description: >-
        Generates a key acting through the given access group, exactly as a user
        does. The raw value is returned **once, in this response, and never
        again** — only its SHA-256 is stored. A caller that loses it has to
        provision a new one.


        This is how a service integration such as the standalone AI worker
        (`ai-worker/`) obtains its `TRINETRA_API_KEY`.


        **Requires permission:** `apikey.manage`
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/api-keys/{id}:
    delete:
      tags:
        - API keys
      summary: Revoke an API key
      description: >-
        Takes effect on the key's next request: it resolves to no groups and
        therefore no permissions, and authentication then fails as a uniform
        `401 Invalid API key` — indistinguishable from an unknown or expired
        key.


        You may revoke a key only if you could have provisioned it — its access
        group is within your reach for `apikey.manage`. A key outside your reach
        returns `404`, identical to an unknown id and left untouched, so
        `apikey.manage` can no longer kill another department's integration key
        or the platform-admin key.


        Idempotent: revoking an already-revoked key you can reach still returns
        `204`. The row is kept for audit and is never deleted.


        **Requires permission:** `apikey.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

  /api/v1/access-groups/{id}/scopes:
    post:
      tags:
        - Access control
      summary: Add a scope to a group
      description: >-
        Narrows where a group's permissions apply. Three types:

        - `ORGANIZATION` — an organization unit and everything beneath it;

        - `GEOGRAPHY` — a geographic area and its descendants;

        - `RESOURCE` — one named resource.


        Organization and geography are **independent dimensions and are ANDed**:
        a group scoped to a department and to a district grants access only
        where the two overlap. Adding a second scope on the same dimension
        widens within that dimension.


        A scoped caller cannot point a scope at an organization unit they do not
        administer themselves — that would be escalation by another route.


        **Requires permission:** `group.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddScopeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
  /api/v1/access-groups/{id}/scopes/{scopeId}:
    delete:
      tags:
        - Access control
      summary: Remove a scope from a group
      description: >-
        **Removing a scope widens the group**, which is the opposite of what
        'remove' suggests: a dimension nobody constrains is unrestricted, so
        dropping the last `ORGANIZATION` scope turns a departmental group into
        an estate-wide one.


        For that reason only a caller who is already unscoped for `group.manage`
        may remove the last organization scope; anyone else gets 403. Removing
        one of several is ordinary narrowing and is allowed.


        **Requires permission:** `group.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

    get:
      tags:
        - VMS
      summary: Read a target's connector health history
      description: >-
        What the workers have observed about this target, newest first: poll
        latency, camera count seen, consecutive failures, whether the circuit
        breaker is open, the last error, events collected since the previous
        check, and how far the event cursor is behind.


        `cursorLagSeconds` is the number to watch — a healthy target with a
        growing lag is collecting events slower than the device produces them.


        Defaults to the last 50 checks within 7 days; `limit` and `days` narrow
        or widen that.


        **Requires permission:** `vms.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

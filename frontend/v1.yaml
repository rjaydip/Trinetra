      description: >-
        The flattened set of permission codes this account currently holds,
        resolved through every unexpired group membership. **Computed, not
        stored** — there is nothing to write here; change membership instead.


        This is the route for answering 'why can this person not see that
        camera'. Note that a permission code alone does not say *where* it
        applies: scope comes from the grants on the groups that carried it,
        under `/access-groups/{id}`.


        Requires authority over the account — otherwise `404`.


        **Requires permission:** `user.read`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

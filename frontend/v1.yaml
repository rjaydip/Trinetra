      description: >-
        Moves a `DRAFT` or `INACTIVE` group to `ACTIVE`, at which point its
        members hold the grant. Re-activating an already-active group is a
        no-op.


        Refused (409) when the group's role is not `ACTIVE` — the group would
        grant nothing.


        **A group missing an ORGANIZATION scope or a GEOGRAPHY scope is
        unrestricted on that dimension** — an estate-wide grant. A caller not
        unscoped for `group.manage` on that dimension is refused (409) and must
        add the missing scope. A caller who *is* unscoped there must acknowledge
        it: re-send with `confirmUnscoped: true`.


        **Requires permission:** `group.manage`

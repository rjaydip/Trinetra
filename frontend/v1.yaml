      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []
    post:
      tags:
        - Users
      summary: Add a user to an access group
      description: >-
        **How permissions are granted.** Optionally with `expiresAt`, which is
        the intended way to give access for an incident or a secondment — it
        lapses on its own rather than depending on someone remembering to revoke
        it.


        This is the platform's privilege-escalation chokepoint, and a scoped
        caller must clear three checks, each a 403:

        1. the group grants no permission the caller does not already hold;

        2. the group declares an organization scope — an unscoped group applies
        across every department, so granting one is granting the estate;

        3. the group's scopes are within the units the caller administers.


        A caller who is unscoped for `user.manage` bypasses all three, which is
        what being unscoped means.


        Granting a membership does **not** force the user to log in again — a
        newly granted permission appears in their access token the next time
        their client refreshes it (within ~15 minutes). Only *removal* is
        applied immediately.


        **Requires permission:** `user.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignGroupRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Not authenticated
        "403":
          description: Insufficient permission or out of scope
        "404":
          description: Not Found
        "500":
          description: Unexpected server error returned as ProblemDetails.
      security:
        - Bearer: []
        - ApiKey: []
        - OAuth2: []

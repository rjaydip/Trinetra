        dimension** — a group with geography scopes but no organization scope
        grants its permissions across every department. Read the scope list, not
        just the permission list, before deciding what a group actually confers.


        A group outside your reach returns `404`, identical to one that does not
        exist.


        **Requires permission:** `group.read`
      parameters:

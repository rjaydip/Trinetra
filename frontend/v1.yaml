  /api/v1/vms/{id}/credential:
    put:
      tags:
        - Credentials
      summary: Store the credential a connector authenticates to this device with
      description: >-
        **Step 2 of onboarding.** Seals a username with a password or a token
        under the reference already recorded on the target, encrypting it
        application-side with AES-256-GCM so the database never holds the key.
        Supply a password or a token; supplying neither is a 400.


        Writing again replaces what is there — this is also the rotation route.
        Workers pick the new value up at their next connect.


        The reference comes from the target row, **never from the request
        body**: a caller-supplied reference in a flat namespace would let a
        district-scoped administrator overwrite the credential of every target
        in the estate.


        The response echoes the reference and a timestamp, and nothing that was
        stored. Gated separately from `vms.update` because writing the password
        a connector authenticates with is the highest-privilege action in the
        system.


        **Requires permission:** `credential.write`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:

# Trinetra streaming gateway — OPTIONAL alternative public HLS surface (docs/STREAMING-GATEWAY-PLAN.md, G4).
#
# NOT required for the default deployment: Federation.Api now proxies HLS directly to MediaMTX
# itself (GET /api/v1/streams/{cameraId}/{*hlsPath}, StreamSessionEndpoints.ProxyAsync) — a
# deployment only needs the API and MediaMTX, no nginx. This file exists for a deployment that
# would rather front MediaMTX with its own dedicated reverse proxy instead (e.g. to keep
# byte-volume HLS traffic off the API process's own thread pool under heavy viewer load — see
# docs/STREAMING-GATEWAY-PLAN.md §2's "why" note for that tradeoff).
#
# Every request here is validated against a short-lived per-camera JWT (minted by
# GET /api/v1/streams/{cameraId}/session) before a single byte of MediaMTX's HLS output is
# proxied through — MediaMTX itself has no concept of this platform's RBAC and binds to
# 127.0.0.1 only (deploy/mediamtx/mediamtx.yml), reachable from nowhere but this nginx.
#
# Install as a server block (e.g. /etc/nginx/sites-available/trinetra-streaming, symlinked into
# sites-enabled), or `include` this file's `location` blocks into an existing TLS-terminating
# server block for this host — either way, TLS termination and the rest of docs/DEPLOYMENT.md §7
# ("What is not covered here" — TLS termination, mTLS between platform services) still applies:
# this config assumes it is placed behind whatever already terminates TLS for the platform.

# --- Federation.Api upstream -------------------------------------------------
# Adjust the port to match this host's actual API deployment (5261 is the systemd/bare-metal
# default per deploy/systemd/trinetra-api.service; a Docker deployment may differ).
upstream trinetra_api {
    server 127.0.0.1:5261;
}

# --- MediaMTX HLS upstream ----------------------------------------------------
upstream trinetra_mediamtx_hls {
    server 127.0.0.1:8888;
}

server {
    # Merge these locations into your TLS server block, or terminate TLS here directly --
    # listen/server_name/ssl_certificate intentionally left out of this file so it composes
    # either way rather than assuming one.

    # --- Token validation subrequest ------------------------------------------
    # Internal only -- never reachable directly, only via `auth_request` below. Forwards just
    # the Authorization header a real request would carry; no request body, no other headers
    # this endpoint has no use for.
    location = /internal/streams/validate {
        internal;
        proxy_pass http://trinetra_api/api/v1/streams/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # --- Public HLS surface ----------------------------------------------------
    # /streams/{cameraId}/index.m3u8, /streams/{cameraId}/{segment} -- matches MediaMTX's own
    # HLS path shape (http://127.0.0.1:8888/{path}/...), with {path} being provision_paths.py's
    # `cam-{cameraId}` naming (deploy/mediamtx/provision_paths.py:mediamtx_path_name).
    location ~ ^/streams/(?<req_camera_id>[0-9a-fA-F-]+)/(?<hls_rest>.+)$ {
        auth_request /internal/streams/validate;

        # The validated camera id the token actually authorizes, recovered from the
        # X-Camera-Id response header StreamSessionEndpoints.ValidateAsync sets on 200 --
        # NOT trusted from the URL alone. A valid token for camera A must not be replayable
        # against camera B's stream just by editing the URL path.
        auth_request_set $token_camera_id $upstream_http_x_camera_id;

        # `if` is normally discouraged in a `location` block, but a read-only equality check
        # ending in `return` (no rewrite/proxy_pass branching) is the documented safe case --
        # see nginx's own "if is evil" guidance. This is that case.
        if ($token_camera_id != $req_camera_id) {
            return 403;
        }

        proxy_pass http://trinetra_mediamtx_hls/cam-$req_camera_id/$hls_rest;
        proxy_set_header Host $host;

        # HLS is many small, frequent requests (a playlist refetch every segment duration, then
        # each segment itself) -- keep proxy buffering minimal latency-wise but do not disable
        # it outright; segments are small enough that buffering does not meaningfully add delay.
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;

        add_header Cache-Control "no-store"; # a stream token expires in 5 minutes; nothing here should be cached past that.
    }
}
